<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Dados</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e1e2f, #2d2b55);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #ff007f;
      text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 25px;
    }

    .dice-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .dice {
      width: 90px;
      height: 90px;
      background: #ffffff;
      border-radius: 16px;
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
      padding: 12px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 0 10px 20px rgba(0,0,0,0.3);
      transition: transform 0.4s ease;
    }

    .dot {
      width: 16px;
      height: 16px;
      background-color: #333;
      border-radius: 50%;
      justify-self: center;
      align-self: center;
      visibility: hidden;
    }

    .roll-btn {
      background: linear-gradient(45deg, #ff007f, #7928ca);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
      transition: all 0.2s ease;
      width: 100%;
    }

    .roll-btn:active {
      transform: scale(0.96);
    }

    .result {
      margin-top: 25px;
      font-size: 1.4rem;
      font-weight: bold;
      min-height: 35px;
      color: #00f2fe;
    }

    /* Animación de giro */
    .shake {
      animation: shake 0.5s ease-in-out;
    }

    @keyframes shake {
      0% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-15deg) scale(1.1); }
      40% { transform: rotate(15deg) scale(1.1); }
      60% { transform: rotate(-10deg) scale(1.05); }
      80% { transform: rotate(10deg) scale(1.05); }
      100% { transform: rotate(0deg) scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Lanza los Dados</h1>
    <p class="subtitle">Toca el botón para probar tu suerte</p>

    <div class="dice-container">
      <div class="dice" id="dice1"></div>
      <div class="dice" id="dice2"></div>
    </div>

    <button class="roll-btn" onclick="rollDice()">¡Lanzar!</button>

    <div class="result" id="resultText">Presiona ¡Lanzar!</div>
  </div>

  <script>
    // Mapeo de puntos según el número del dado (1 a 6)
    const dicePatterns = {
      1: [4],
      2: [0, 8],
      3: [0, 4, 8],
      4: [0, 2, 6, 8],
      5: [0, 2, 4, 6, 8],
      6: [0, 2, 3, 5, 6, 8]
    };

    function renderDice(diceElement, number) {
      diceElement.innerHTML = '';
      for (let i = 0; i < 9; i++) {
        const dot = document.createElement('div');
        dot.classList.add('dot');
        if (dicePatterns[number].includes(i)) {
          dot.style.visibility = 'visible';
        }
        diceElement.appendChild(dot);
      }
    }

    function rollDice() {
      const dice1 = document.getElementById('dice1');
      const dice2 = document.getElementById('dice2');
      const resultText = document.getElementById('resultText');

      // Agregar clase de animación
      dice1.classList.add('shake');
      dice2.classList.add('shake');
      resultText.innerText = "Lanzando...";

      setTimeout(() => {
        const val1 = Math.floor(Math.random() * 6) + 1;
        const val2 = Math.floor(Math.random() * 6) + 1;

        renderDice(dice1, val1);
        renderDice(dice2, val2);

        const total = val1 + val2;
        resultText.innerText = `¡Obtuviste ${total}! (${val1} + ${val2})`;

        // Quitar la animación para poder reusarla
        dice1.classList.remove('shake');
        dice2.classList.remove('shake');
      }, 500);
    }

    // Inicializar dados en 1
    renderDice(document.getElementById('dice1'), 1);
    renderDice(document.getElementById('dice2'), 1);
  </script>
</body>
</html>
